<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="描述占位。">
    <meta name="theme-color" content="#F5F6F8">
    <script>
        (function () {
            var seen = false;
            try {
                seen = sessionStorage.getItem('nn-splash-seen') === '1';
            } catch (error) {}
            document.documentElement.classList.add(seen ? 'splash-skip' : 'splash-pending');
        })();
    </script>
    <title>标题占位</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="animations.css">
    <noscript>
        <style>
            .splash { display: none; }
        </style>
    </noscript>
</head>
<body>
    <div class="splash" id="splash" role="dialog" aria-modal="true" aria-label="进入页面">
        <div class="splash-bg" aria-hidden="true">
            <!-- 换成视频：<video class="splash-media" autoplay muted loop playsinline poster="assets/splash.svg"><source src="assets/splash.mp4" type="video/mp4"></video> -->
            <img class="splash-media" src="assets/splash.svg" alt="">
        </div>
        <div class="splash-mask" aria-hidden="true"></div>
        <div class="splash-inner">
            <p class="splash-text">文案占位</p>
        </div>
    </div>

    <script>
        try {
            if (localStorage.getItem('nn-theme') === 'dark') document.body.classList.add('dark');
        } catch (error) {}
    </script>


    <aside class="sidebar" aria-label="侧边导航">
        <div class="sidebar-head">
            <a class="sidebar-brand" href="index.html" aria-label="名称占位 首页">
                <span class="sidebar-avatar" aria-hidden="true">占位</span>
                <span class="sidebar-brand-copy">
                    <strong>名称占位</strong>
                    <small>副标题占位</small>
                </span>
            </a>
            <button class="sidebar-toggle" type="button" aria-label="收起侧边栏" aria-expanded="true" title="收起侧边栏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
            </button>
        </div>

        <nav class="sidebar-nav" aria-label="主导航">
            <a class="sidebar-link" href="index.html" aria-current="page">
                <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></span>
                <span class="sidebar-label">首页</span>
            </a>
            <a class="sidebar-link" href="blog.html">
                <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span>
                <span class="sidebar-label">博客</span>
            </a>
            <a class="sidebar-link" href="index.html#about">
                <span class="sidebar-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.9-3.6 3.6-5.2 7-5.2s6.1 1.6 7 5.2"/></svg></span>
                <span class="sidebar-label">关于</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <button class="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false">
                <span class="theme-toggle-icon" aria-hidden="true">◐</span>
                <span class="sidebar-label theme-label">深色模式</span>
            </button>
            <p class="sidebar-note">版本占位</p>
        </div>
    </aside>

    <main class="content-area">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow reveal"><span class="status-dot" aria-hidden="true"></span>标签占位</p>
                <h1 id="hero-title" class="reveal">标题 <span class="highlight-word">占位</span></h1>
                <p class="hero-intro reveal">说明文本占位，<strong>强调占位</strong>。</p>
                <div class="hero-actions reveal">
                    <a class="btn btn-primary" href="blog.html">按钮占位一 <span class="btn-arrow" aria-hidden="true">↗</span></a>
                    <a class="btn btn-glass" href="#work">按钮占位二</a>
                </div>
            </div>
        </section>

        <div class="ticker" aria-label="动态信息">
            <div class="ticker-track">
                <span>滚动文字占位</span>
                <span class="ticker-dot" aria-hidden="true">✦</span>
                <span>滚动文字占位</span>
                <span class="ticker-dot" aria-hidden="true">✦</span>
                <span>滚动文字占位</span>
            </div>
        </div>

        <section class="work" id="work" aria-labelledby="work-title">
            <div class="section-heading reveal">
                <h2 id="work-title">区块标题 <span class="accent">占位</span></h2>
                <p class="section-label">01 / 说明占位</p>
            </div>
            <div class="project-list">
                <a class="project reveal" href="#">
                    <span class="project-index">01</span>
                    <h3>项目标题占位</h3>
                    <span class="project-meta">说明占位</span>
                </a>
                <a class="project reveal" href="blog.html">
                    <span class="project-index">02</span>
                    <h3>项目标题占位</h3>
                    <span class="project-meta">说明占位</span>
                </a>
                <a class="project reveal" href="#contact">
                    <span class="project-index">03</span>
                    <h3>项目标题占位</h3>
                    <span class="project-meta">说明占位</span>
                </a>
            </div>
        </section>

        <section class="about" id="about" aria-labelledby="about-title">
            <p class="section-label reveal">02 / 说明占位</p>
            <div>
                <h2 id="about-title" class="reveal">标题占位</h2>
                <p class="about-copy reveal">正文占位，<em>强调占位</em>。</p>
                <div class="contact reveal" id="contact">
                    <span class="meta">说明占位</span>
                    <a href="mailto:hello@example.com">邮箱占位 <span aria-hidden="true">↗</span></a>
                </div>
            </div>
        </section>

        <footer>
            <span>© 版权占位</span>
            <span>页脚说明占位</span>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
